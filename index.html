<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Gestion — Informations légales</title>
<style>
  :root{
    --bg:#0f1117; --card:#171a23; --text:#e7e9ee; --muted:#9aa1b1;
    --accent:#5865F2; --border:#2a2e3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{max-width:640px; width:100%;}
  h1{font-size:1.8rem; margin-bottom:4px;}
  p.sub{color:var(--muted); margin-top:0;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:20px 24px; margin-top:24px;
  }
  a.link-btn{
    display:flex; align-items:center; justify-content:space-between;
    text-decoration:none; color:var(--text);
    padding:16px 18px; border:1px solid var(--border); border-radius:10px;
    margin-bottom:12px; background:#1c2029; transition:.15s;
  }
  a.link-btn:hover{border-color:var(--accent); background:#20243050;}
  a.link-btn span.arrow{color:var(--accent); font-size:1.1rem;}
  footer{margin-top:24px; color:var(--muted); font-size:.85rem; text-align:center;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>🤖 Bot Gestion</h1>
    <p class="sub">Documentation légale du bot Discord.</p>
    <div class="card">
      <a class="link-btn" href="terms.html">
        Conditions d'utilisation (Terms of Service) <span class="arrow">→</span>
      </a>
      <a class="link-btn" href="privacy.html">
        Politique de confidentialité (Privacy Policy) <span class="arrow">→</span>
      </a>
    </div>
    <footer>Dernière mise à jour : 18 septembre 2026</footer>
  </div>
</body>
</html>
